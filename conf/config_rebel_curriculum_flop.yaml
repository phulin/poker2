# Postflop curriculum entry point for distilling `E_flop`, training `S_flop`,
# then distilling the preflop handoff net `E_preflop`.
#
# Requires a promoted `S_turn` checkpoint in the curriculum state, or an
# explicit checkpoint override on `curriculum.distill_E_flop.checkpoint`.

defaults:
  - config_rebel_cfr
  - _self_

checkpoint_dir: checkpoints-rebel-curriculum
num_steps: 5000
wandb_project: poker-rebel-postflop-curriculum
wandb_tags: ["rebel", "cfr", "postflop-curriculum", "flop"]

data:
  mode: live
  live_root_source: random_flop

curriculum:
  stages: [distill_E_flop, flop, distill_E_preflop]
  wandb_group: rebel_postflop_curriculum
  promote_dir: checkpoints-rebel-curriculum/promoted
  substeps:
    distill_E_flop:
      kind: distill
      net: E_flop
      from_net: S_turn
      chance: single_card
      num_steps: ${num_steps}
      train_overrides:
        learning_rate: 0.08
        learning_rate_final: 0.008
        lr_schedule: linear
        adamw_learning_rate: 0.08
        batch_size: 1024
    flop:
      kind: train
      net: S_flop
      from_net: S_turn
      closing_net: E_flop
      closing_checkpoint: null
      num_steps: ${num_steps}
    distill_E_preflop:
      kind: distill
      net: E_preflop
      from_net: S_flop
      chance: sample_flops
      num_steps: ${num_steps}
      model_overrides:
        preflop_hand_dim: 169
      train_overrides:
        learning_rate: 0.08
        learning_rate_final: 0.008
        lr_schedule: linear
        adamw_learning_rate: 0.08
        batch_size: 1024

preflop_validation:
  enabled: true
  interval: 100
  examples: 1024
  batch_size: 128
