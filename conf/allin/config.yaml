# @package _global_
# All-in equity model training configuration.

defaults:
  - /allin/config_schema@_global_
  - _self_

steps: 32000
batch_size: 128
batch_size_schedule: ""
players: 6

optimizer: muon
learning_rate: 0.015
adamw_learning_rate: 0.024
weight_decay: 0.0001
muon_momentum: 0.95
muon_nesterov: true
muon_eps: 0.0000001
muon_ns_steps: 5
muon_adjust_lr_fn: null
policy_head_muon_learning_rate: 0.0003
lr_decay: cosine
lr_warmdown_start_step: 1
cosine_lr_decay_ratio: 0.015
cosine_lr_decay_steps: 500

model_type: mlp
hidden_dim: 1024
hand_dim: 512
layers: 6
film_rank: 64
transformer_heads: 8
dense_output_residual: false
compile_model: true
compile_dynamic: true
compile_mode: ""

sample_count: 50000
board_samples: 256
tuple_samples: 0
tuple_tries: 4
board_chunk: 8
hand_chunk: 128

bb: 100
min_stack_bb: 10
mid_stack_bb: 200
max_stack_bb: 400
high_stack_mass_ratio: 0.3333333333333333
concentration: 1.0
folded_commit_max_frac: 0.35

seed: 0
device: cuda

wandb_project: p2-allin-equity
wandb_name: null
no_wandb: false
log_interval: 10
eval_interval: 250
eval_batch_size: 512
checkpoint_interval: 500
checkpoint_dir: outputs/checkpoints_allin
resume_checkpoint: null
pregenerated_data: outputs/allin_training_data_512k_s65536_b4096_bc64
validation_data: outputs/allin_validation_data_8192_s1048576_b131072_bc64
