# @package _global_
# All-in equity model training configuration.

defaults:
  - /allin/config_schema@_global_
  - _self_

steps: 8000
batch_size: 512
batch_size_schedule: ""
players: 6

optimizer: muon
learning_rate: 0.015
adamw_learning_rate: 0.024
weight_decay: 0.0001
muon_momentum: 0.95
muon_nesterov: true
muon_eps: 0.0000001
muon_ns_steps: 5
muon_adjust_lr_fn: null
normuon_beta1: 0.95
normuon_beta2: 0.95
normuon_eps: 0.00000001
policy_head_muon_learning_rate: 0.0003
lr_decay: linear
lr_warmup_steps: 0
lr_warmdown_start_step: 1
cosine_lr_decay_ratio: 0.005
cosine_lr_decay_steps: 8000

model_type: player_transformer
hidden_dim: 512
hand_dim: 256
layers: 4
film_rank: 64
transformer_heads: 8
dense_output_residual: false
mask_folded_player_tokens: true
target_mode: eligible_pot_share
compile_model: true
compile_dynamic: true
compile_mode: ""

sample_count: 32768
board_samples: 2048
tuple_samples: 0
tuple_tries: 4
board_chunk: 64
hand_chunk: 128

bb: 100
min_stack_bb: 10
mid_stack_bb: 200
max_stack_bb: 400
high_stack_mass_ratio: 0.3333333333333333
concentration: 1.0
folded_commit_max_frac: 0.35

seed: 0
device: cuda

wandb_project: p2-allin-equity
wandb_name: null
no_wandb: false
log_interval: 1000
eval_interval: 500
eval_batch_size: 512
checkpoint_interval: 8000
checkpoint_dir: outputs/checkpoints_allin
resume_checkpoint: null
pregenerated_data: outputs/allin_training_data_512k_s65536_b4096_bc64
validation_data: outputs/allin_validation_data_4096_s16777216_b2097152_bc64/manifest.json
