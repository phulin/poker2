# Postflop curriculum entry point for distilling `E_turn` then training `S_turn`.
#
# Requires a promoted `S_river` checkpoint in the curriculum state, or an
# explicit checkpoint override on `curriculum.distill_E_turn.checkpoint`.

defaults:
  - config_rebel_cfr
  - _self_

checkpoint_dir: checkpoints-rebel-curriculum
checkpoint_interval: 200
num_steps: 5000
wandb_project: poker-rebel-postflop-curriculum
wandb_tags: ["rebel", "cfr", "postflop-curriculum", "turn"]
log_interval: 25

data:
  mode: live
  live_root_source: random_turn
  belief_mode: mixed
  belief_profile: actions_12_end

train:
  learning_rate: 4e-2
  learning_rate_final: 4e-3
  lr_schedule: cosine
  adamw_learning_rate: 0.04
  batch_size: 2048
  episodes_per_step: 5
  replay_buffer_batches: 32
  save_replay_buffers: true
  replay_buffer_device: cuda
  value_reuse_goal: 2
  policy_capacity_factor: 4
  policy_loss_type: mse
  value_coef: 1.0
  grad_clip: 1.0

model:
  board_interaction_dim: 96
  belief_low_rank_dim: 128
  num_value_layers: 7
  value_output_init_scale: 0.0

  # Fitted for the current E_turn distillation target distribution. Regress new
  # pos/neg/intercept values before reusing this baseline for other stages.
  value_turn_range_equity_baseline: true
  value_turn_range_equity_rank_bins: 144
  value_turn_range_equity_chunk_size: 64
  value_turn_range_equity_blockers: false
  value_turn_range_equity_pos_scale: 1.0111476615306025
  value_turn_range_equity_neg_scale: 0.5328414364058676
  value_turn_range_equity_intercept: -0.008690868801753902

search:
  depth: 5
  bet_bins_by_depth:
    - [0.25, 0.5, 0.75, 1.0, 1.5]
    - [0.5, 1.0]
    - [1.0]
    - [1.0]
    - []
  allin_by_depth: [true, true, true, true, false]
  cfr_type: sapcfr
  predictive_cfr_delay: 40
  predictive_cfr_dcfr_hybrid: true
  iterations: 300
  iterations_final: 300
  dcfr_plus_delay: 80
  warm_start_iterations: 15
  warm_start_type: model_br
  warm_start_multiplier: 2

curriculum:
  stages: [distill_E_turn, turn]
  wandb_group: rebel_postflop_curriculum
  promote_dir: checkpoints-rebel-curriculum/promoted
  substeps:
    distill_E_turn:
      kind: distill
      net: E_turn
      from_net: S_river
      chance: single_card
      num_steps: 100000
      train_overrides:
        learning_rate: 0.02
        learning_rate_final: 0.002
        lr_schedule: linear
        adamw_learning_rate: 0.02
        batch_size: 1024
    turn:
      kind: train
      net: S_turn
      # The train runner initializes the value model from closing_net when no
      # explicit value_checkpoint is set. Leave from_net unset so policy starts
      # fresh instead of inheriting the river policy.
      closing_net: E_turn
      closing_checkpoint: null
      num_steps: ${num_steps}
