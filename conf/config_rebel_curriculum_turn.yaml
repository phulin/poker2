# Initial postflop curriculum entry point for the implemented turn train stage.
#
# This config assumes `E_turn` leaf routing is added before full-quality turn
# training. It is useful now for exercising random turn root generation and
# train-stage orchestration.

defaults:
  - config_rebel_cfr
  - _self_

checkpoint_dir: checkpoints-rebel-curriculum
num_steps: 5000
wandb_project: poker-rebel-postflop-curriculum
wandb_tags: ["rebel", "cfr", "postflop-curriculum", "turn"]

data:
  mode: live
  live_root_source: random_turn

curriculum:
  stages: [turn]
  wandb_group: rebel_postflop_curriculum
  promote_dir: checkpoints-rebel-curriculum/promoted
  turn:
    kind: train
    net: S_turn
    closing_net: E_turn
    closing_checkpoint: null
    num_steps: ${num_steps}
