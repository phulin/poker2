# Full fixed-schedule postflop curriculum: train river, distill/train turn,
# distill/train flop, then distill the preflop handoff net.

defaults:
  - config_rebel_cfr
  - _self_

checkpoint_dir: checkpoints-rebel-curriculum
wandb_project: poker-rebel-postflop-curriculum
wandb_tags: ["rebel", "cfr", "postflop-curriculum", "fixed-schedule"]

data:
  mode: live
  live_root_source: random_river
  include_pre_chance_value_batches: false

curriculum:
  stages: [river, distill_E_turn, turn, distill_E_flop, flop, distill_E_preflop]
  wandb_group: rebel_postflop_curriculum
  promote_dir: checkpoints-rebel-curriculum/promoted

  # Fixed schedules. Override these on the command line for real runs via
  # `curriculum.substeps.<name>.num_steps=...`.
  substeps:
    river:
      kind: train
      net: S_river
      num_steps: 200000
      data_overrides:
        live_root_source: random_river
    distill_E_turn:
      kind: distill
      net: E_turn
      from: S_river
      chance: single_card
      num_steps: 20000
      train_overrides:
        learning_rate: 0.08
        learning_rate_final: 0.008
        lr_schedule: linear
        adamw_learning_rate: 0.08
        batch_size: 1024
    turn:
      kind: train
      net: S_turn
      from: S_river
      closing_net: E_turn
      closing_checkpoint: null
      num_steps: 150000
      data_overrides:
        live_root_source: random_turn
    distill_E_flop:
      kind: distill
      net: E_flop
      from: S_turn
      chance: single_card
      num_steps: 20000
      train_overrides:
        learning_rate: 0.08
        learning_rate_final: 0.008
        lr_schedule: linear
        adamw_learning_rate: 0.08
        batch_size: 1024
    flop:
      kind: train
      net: S_flop
      from: S_turn
      closing_net: E_flop
      closing_checkpoint: null
      num_steps: 150000
      data_overrides:
        live_root_source: random_flop
    distill_E_preflop:
      kind: distill
      net: E_preflop
      from: S_flop
      chance: sample_flops
      num_steps: 30000
      model_overrides:
        preflop_hand_dim: 169
      train_overrides:
        learning_rate: 0.08
        learning_rate_final: 0.008
        lr_schedule: linear
        adamw_learning_rate: 0.08
        batch_size: 1024

preflop_validation:
  enabled: true
  interval: 100
  examples: 1024
  batch_size: 128
