# ReBeL-style CFR training configuration using the feed-forward model.

defaults:
  - _self_

num_steps: 5000
use_tensor_env: true
num_envs: 1024
device: cuda
checkpoint_dir: checkpoints-rebel
checkpoint_interval: 50
economize_checkpoints: true
use_wandb: true
wandb_project: poker-rebel-cfr
wandb_tags: ["rebel", "cfr"]

train:
  learning_rate: 1e-3
  learning_rate_final: 1e-4
  lr_schedule: cosine
  warmup_steps: 0

  weight_decay: 0.01
  optimizer: adamw # override to muon or normuon for 2D linear weights
  adamw_learning_rate: null # if set, one LR for all AdamW params
  policy_head_muon_learning_rate: 0.02
  batch_size: 4096
  episodes_per_step: 10
  replay_buffer_batches: 16
  replay_buffer_device: cuda
  value_reuse_goal: 4
  policy_capacity_factor: 10
  policy_depth_stratify_decimate: true
  policy_depth_stratify_sample: true
  policy_depth_stratify_probs: null
  policy_node_weighting: uniform
  policy_loss_type: cross_entropy
  policy_logit_l2_coef: 1e-6
  policy_extra_updates_per_step: 0
  policy_extra_batch_size: null # if null, uses train.batch_size
  value_coef: 1.0
  entropy_coef: 0.0
  permutation_coef: 0.1
  grad_clip: 1.0

  stratify_streets: []
    # - threshold: 500
    #   probabilities: [0.03, 0.03, 0.09, 0.85]
    # - threshold: 1500
    #   probabilities: [0.05, 0.05, 0.15, 0.75]
    # - threshold: 2500
    #   probabilities: [0.15, 0.15, 0.30, 0.40]
    # - threshold: 3500
    #   probabilities: [0.25, 0.25, 0.25, 0.25]

  model_ema: null

data:
  mode: live
  pregenerated:
    value_batch_size: null
    policy_batch_size: null
    shuffle: true
    pin_memory: true
    async_shard_prefetch: true
    validate_manifest: true
    datasets: []

model:
  name: BetterFFN
  nonlinearity: leaky_relu
  hidden_dim: 1024
  range_hidden_dim: 256
  ffn_dim: 1024
  board_interaction_dim: 64
  policy_rank: 128
  policy_hand_bias_rank: 32

  shared_trunk: true # DO NOT detach policy head from trunk
  num_hidden_layers: 4
  num_value_layers: 1
  num_policy_layers: 2

  detach_value_head: false
  compile: default
  enforce_zero_sum: true

  num_recursions: 6
  num_iterations: 3
  num_supervisions: 16

env:
  stack: 10000
  stack_mode: weighted_uniform_bb
  min_stack_bb: 10
  mid_stack_bb: 200
  max_stack_bb: 400
  high_stack_mass_ratio: 0.3333333333333333
  sb: 50
  bb: 100
  bet_bins: [0.25, 0.5, 0.75, 1.0, 1.5]

search:
  enabled: true
  depth: 5
  bet_bins_by_depth:
    - [0.25, 0.5, 0.75, 1.0, 1.5]
    - [0.5, 1.0]
    - [1.0]
    - [1.0]
    - []
  allin_by_depth: [true, true, true, true, false]
  preflop_allin_table_path: outputs/preflop_allin_table.pt.zst
  sparse: true
  sparse_fused: true
  value_targets_from_final_policy: true

  cfr_type: discounted
  cfr_avg: false
  cfr_plus: false

  iterations: 400
  iterations_final: 1000
  # warm_start_iterations and dcfr_plus_delay are derived from the
  # current cfr_iterations each step (iterations/20 and iterations*0.4
  # respectively); these static values are starting points that the
  # trainer overwrites — see _apply_schedules in cfr_trainer.py.
  warm_start_iterations: 10
  warm_start_type: model
  warm_start_multiplier: 10
  dcfr_plus_delay: 80

  dcfr_alpha: 3.0
  dcfr_alpha_final: 4.0
  dcfr_beta: -1.0
  dcfr_beta_final: -2.0
  dcfr_gamma: 5.0
  dcfr_gamma_final: 0.0

trueskill:
  enabled: true
  snapshot_frac: 0.01
  game_budget_frac: 0.03
  actions_per_game: 16
  eval_solves_per_action: 2.0
  eval_inefficiency_factor: 2.0
  recency_tau_frac: 0.25
  opponents_per_eval: 10
  min_games_per_opponent: 1
  max_games_per_opponent: 64
  gaussian_initial_mu: 0.0
  gaussian_initial_sigma: 1.0
  gaussian_beta: 1.0
  gaussian_tau: 0.01
  snapshot_dtype: bfloat16
