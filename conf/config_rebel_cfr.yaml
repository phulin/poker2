# ReBeL-style CFR training configuration using the feed-forward model.

defaults:
  - _self_

num_steps: 5000
use_tensor_env: true
num_envs: 512
device: cuda
checkpoint_dir: checkpoints-rebel
checkpoint_interval: 50
economize_checkpoints: true
use_wandb: true
wandb_project: poker-rebel-cfr
wandb_tags: ["rebel", "cfr"]

train:
  learning_rate: 4e-2
  learning_rate_final: 4e-3
  lr_schedule: cosine
  warmup_steps: 0
  lr_wsd_decay_fraction: 0.2

  weight_decay: 0.01
  optimizer: muon
  adamw_learning_rate: 0.04 # if set, one LR for all AdamW params
  policy_head_muon_learning_rate: 0.02
  batch_size: 2048
  episodes_per_step: 5
  replay_buffer_batches: 128
  replay_buffer_device: cuda
  replay_buffer_underfull_evict_fraction: 0.25
  value_reuse_goal: 2
  policy_capacity_factor: 4
  policy_depth_stratify_decimate: true
  policy_depth_stratify_sample: true
  policy_depth_stratify_probs: null
  policy_node_weighting: uniform
  policy_loss_type: mse
  policy_logit_l2_coef: 0
  policy_extra_updates_per_step: 0
  policy_extra_batch_size: null # if null, uses train.batch_size
  value_coef: 1.0
  entropy_coef: 0.0
  permutation_coef: 0.1
  grad_clip: 1.0

  stratify_streets: []
    # - threshold: 500
    #   probabilities: [0.03, 0.03, 0.09, 0.85]
    # - threshold: 1500
    #   probabilities: [0.05, 0.05, 0.15, 0.75]
    # - threshold: 2500
    #   probabilities: [0.15, 0.15, 0.30, 0.40]
    # - threshold: 3500
    #   probabilities: [0.25, 0.25, 0.25, 0.25]

  model_ema: null

data:
  # live = production CFR roots; pregenerated = fixed HP-sweep data;
  # hybrid = live training plus pregenerated holdout metrics.
  mode: live
  live_root_source: self_play
  include_pre_chance_value_batches: false
  warmup_self_play_roots: true
  pregenerated:
    value_batch_size: null
    policy_batch_size: null
    shuffle: true
    direct_sample: false
    pin_memory: true
    async_shard_prefetch: true
    validate_manifest: true
    datasets: []

model:
  name: BetterFFN
  nonlinearity: leaky_relu
  hidden_dim: 384
  range_hidden_dim: 192
  ffn_dim: 768
  board_interaction_dim: 64
  policy_rank: 96
  policy_hand_bias_rank: 24
  street_value_heads: both
  preflop_model_type: ffn
  preflop_transformer_heads: 8
  legacy_context_features: false

  shared_trunk: true # Keep policy gradients through shared input encoders.
  num_hidden_layers: 0
  num_value_layers: 7
  num_policy_layers: 6

  detach_value_head: false
  compile: default
  enforce_zero_sum: true

  num_recursions: 6
  num_iterations: 3
  num_supervisions: 16

env:
  stack: 10000
  stack_mode: weighted_uniform_bb
  min_stack_bb: 10
  mid_stack_bb: 200
  max_stack_bb: 400
  high_stack_mass_ratio: 0.3333333333333333
  sb: 50
  bb: 100
  bet_bins: [0.25, 0.5, 0.75, 1.0, 1.5]

search:
  enabled: true
  depth: 5
  bet_bins_by_depth:
    - [0.25, 0.5, 0.75, 1.0, 1.5]
    - [0.5, 1.0]
    - [1.0]
    - [1.0]
    - []
  allin_by_depth: [true, true, true, true, false]
  preflop_allin_table_path: outputs/preflop_allin_table.pt.zst
  preflop_allin_169_cache_path: outputs/precompute/preflop_allin_169_u16.pt.zst
  preflop_allin_169_model_checkpoint: outputs/checkpoints_allin_169_transformer/allin_256k_xf4_h192_hd128_mainlr00025_adamw0004_bs1024_maskfold_s16384_b1024_min4/latest.pt
  sparse: true
  sparse_fused: true
  value_targets_from_final_policy: false

  cfr_type: discounted
  sapcfr_alpha: 2.0
  predictive_cfr_dcfr_hybrid: true
  predictive_cfr_delay: -1
  cfr_avg: false
  cfr_plus: false

  iterations: 400
  iterations_final: 1000
  # warm_start_iterations is held constant at this value by the trainer;
  # dcfr_plus_delay is derived each step as iterations*0.2 (the static value
  # below is just a starting point) — see _apply_schedules in cfr_trainer.py.
  warm_start_iterations: 15
  warm_start_type: model_br
  # seed weight = warm_start_iterations * warm_start_multiplier. River sweeps
  # (10 spots, final geomean at 1000 CFR iterations) show the intended
  # 15 * 2 = 30 model_br seed beats lighter 10-iteration/15-iteration variants.
  warm_start_multiplier: 2
  dcfr_plus_delay: 80

  dcfr_alpha: 3.0
  dcfr_alpha_final: 4.0
  dcfr_beta: -1.0
  # beta-ramp removed: holding beta constant (== dcfr_beta) tested marginally
  # best on river spots; see river-cfr-exploitability-trajectory wandb runs.
  dcfr_beta_final: null
  dcfr_gamma: 5.0
  dcfr_gamma_final: 0.0

trueskill:
  enabled: true
  snapshot_frac: 0.02
  game_budget_frac: 0.03
  actions_per_game: 16
  eval_solves_per_action: 2.0
  eval_inefficiency_factor: 2.0
  recency_tau_frac: 0.25
  opponents_per_eval: 10
  min_games_per_opponent: 1
  max_games_per_opponent: 64
  gaussian_initial_mu: 0.0
  gaussian_initial_sigma: 1.0
  gaussian_beta: 1.0
  gaussian_tau: 0.01
  snapshot_dtype: bfloat16
