<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BetterFFN WebGPU CFR</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #101418;
        color: #eef3f8;
      }
      main {
        width: min(720px, calc(100vw - 32px));
      }
      h1 {
        font-size: 24px;
        font-weight: 650;
        margin: 0 0 16px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      input,
      button {
        height: 36px;
        border: 1px solid #3a4652;
        border-radius: 6px;
        background: #151c23;
        color: inherit;
        font: inherit;
      }
      input {
        flex: 1;
        padding: 0 10px;
      }
      button {
        padding: 0 14px;
        cursor: pointer;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 10px 8px;
        border-bottom: 1px solid #29323b;
        text-align: left;
      }
      td:last-child,
      th:last-child {
        text-align: right;
      }
      #status {
        min-height: 22px;
        color: #aab7c4;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BetterFFN WebGPU CFR</h1>
      <div class="toolbar">
        <input id="spot" value="1" aria-label="Action-bin sequence" />
        <button id="run">Run</button>
      </div>
      <div id="status"></div>
      <table>
        <thead>
          <tr>
            <th>Action</th>
            <th>Probability</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </main>
    <script type="module">
      import {
        createBrowserCfrEvaluator,
        createBrowserDevice,
        loadBrowserModel,
      } from "../dist/src/browser.js";

      const status = document.getElementById("status");
      const rows = document.getElementById("rows");
      const spotInput = document.getElementById("spot");
      const button = document.getElementById("run");

      let evaluator;
      async function getEvaluator() {
        if (evaluator) return evaluator;
        status.textContent = "Loading WebGPU model";
        const device = await createBrowserDevice();
        const model = await loadBrowserModel(
          "./rebel_latest/model.json",
          "./rebel_latest/weights.bin",
          device,
        );
        evaluator = createBrowserCfrEvaluator(device, model);
        return evaluator;
      }

      button.addEventListener("click", async () => {
        try {
          button.disabled = true;
          rows.textContent = "";
          const spot = spotInput.value
            .split(",")
            .map((v) => v.trim())
            .filter(Boolean)
            .map((v) => Number.parseInt(v, 10));
          const cfr = await getEvaluator();
          status.textContent = "Solving";
          const result = await cfr.evaluateSpot({ spot, iterations: 8 });
          rows.innerHTML = result.actionLabels
            .map(
              (label, index) =>
                `<tr><td>${label}</td><td>${result.actionProbs[index].toFixed(6)}</td></tr>`,
            )
            .join("");
          status.textContent = "Done";
        } catch (error) {
          status.textContent = error instanceof Error ? error.message : String(error);
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
